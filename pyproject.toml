[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implicit-sliding-puzzles"
version = "0.1.0.dev0"
description = "Compact exact solutions for constructively generated sliding puzzles"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
